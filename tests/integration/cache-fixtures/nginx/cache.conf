proxy_cache_path /var/cache/nginx/headerproof levels=1:2 keys_zone=headerproof:10m inactive=10m max_size=64m;

map $request_uri $headerproof_cache_key {
    default "$scheme|$request_method|$host|$request_uri";
    ~^/safe "$scheme|$request_method|$host|$request_uri|$http_x_forwarded_host";
}

server {
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://origin;
        proxy_set_header Host $host;
        proxy_cache headerproof;
        proxy_cache_key $headerproof_cache_key;
        proxy_cache_valid 200 120s;
        add_header X-Cache $upstream_cache_status always;
    }
}
