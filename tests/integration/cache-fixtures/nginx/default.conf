server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    location /vulnerable {
        default_type text/plain;
        add_header Cache-Control "public, max-age=120";
        return 200 "path=$uri xfh=$http_x_forwarded_host host=$host\n";
    }

    location /safe {
        default_type text/plain;
        add_header Cache-Control "public, max-age=120";
        add_header Vary "X-Forwarded-Host";
        return 200 "path=$uri xfh=$http_x_forwarded_host host=$host\n";
    }

    location /clean {
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "static\n";
    }
}
