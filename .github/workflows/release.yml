name: Release

on:
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: Publish the current Python distribution through PyPI Trusted Publishing
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"
      - "ci-*"

permissions:
  contents: read

jobs:
  binary:
    name: Binary - ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: linux-amd64
          - runner: ubuntu-24.04-arm
            asset: linux-arm64
          - runner: macos-15-intel
            asset: darwin-amd64
          - runner: macos-14
            asset: darwin-arm64
          - runner: windows-latest
            asset: windows-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build binary
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller==6.22.3" .
          python packaging/build_binary.py
      - name: Smoke test
        shell: bash
        run: |
          FILE="$(find dist-bin -maxdepth 1 -type f | head -1)"
          "$FILE" --version
          "$FILE" --help >/dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.asset }}
          path: dist-bin/*
          if-no-files-found: error


  python-dist:
    name: Python distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: [binary, python-dist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: python-dist
      - name: Checksums
        working-directory: release
        run: sha256sum headerproof-* > checksums.txt
      - uses: sigstore/cosign-installer@v4.0.0
      - name: Sign checksums
        run: cosign sign-blob release/checksums.txt --bundle release/checksums.txt.sigstore.json --yes
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          test -s "$NOTES"
          gh release create "$GITHUB_REF_NAME" \
            release/* python-dist/* \
            --verify-tag \
            --notes-file "$NOTES" \
            --title "HeaderProof $GITHUB_REF_NAME"


  pypi:
    name: Publish PyPI
    needs: [python-dist]
    if: (startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH_ENABLED == 'true') || inputs.publish_pypi == true
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.2

  docker:
    name: Publish container
    needs: binary
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3.6.0
      - uses: docker/setup-buildx-action@v3.11.1
      - uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: sigstore/cosign-installer@v4.0.0
      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
