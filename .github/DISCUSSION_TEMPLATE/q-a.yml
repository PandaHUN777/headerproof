title: "[Q&A] "
body:
  - type: markdown
    attributes:
      value: |
        Use Q&A when you need help using HeaderProof. For a confirmed reproducible implementation defect, open an issue instead.
  - type: input
    id: version
    attributes:
      label: HeaderProof version
      description: Output of `headerproof --version` when available.
      placeholder: "HeaderProof 1.5.0"
    validations:
      required: false
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: Describe the intended HeaderProof workflow.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Minimal command or workflow
      description: Redact target names and secrets when needed.
      render: shell
    validations:
      required: false
  - type: textarea
    id: tried
    attributes:
      label: What happened and what have you tried?
      description: Include the smallest useful stdout/stderr excerpt when relevant. Do not include secrets.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safe disclosure
      options:
        - label: I have not included credentials, private URLs, unauthorized target details, or vulnerability data I am not permitted to disclose.
          required: true
