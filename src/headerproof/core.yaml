    {
      "id": "cors_arbitrary_origin_with_credentials",
      "check": "cors",
      "request": {
        "kind": "origin-probe"
      },
      "matchers": [
        "exact-origin-reflection",
        "credentials-true"
      ],
      "extractors": [
        "acao",
        "acac",
        "methods"
      ],
      "assessment": {
        "default_state": "observed",
        "gate": [
          {
            "op": "always",
            "value": false
          }
        ],
        "gate_checks": {
          "response_recorded": {
            "op": "status_recorded"
          }
        },
        "reasons": [
          "exact Origin reflected",
          "Access-Control-Allow-Credentials is true"
        ],
        "missing_proof": [
          "authenticated sensitive body read is not proven by header scan"
        ]
      },
      "verification": {
        "objective": "Validate the technical observation independently.",
        "automated_checks": [
          "Record the exact request and response evidence."
        ],
        "manual_confirmation": [
          "Repeat on an authorized target with independent confirmation."
        ],
        "report_gate": "Require independent technical and impact validation before reporting."
      }
    },
